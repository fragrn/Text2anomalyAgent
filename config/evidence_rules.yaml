qps_drop:
  metric: qps
  aggregation: ratio
  reference: baseline
  operator: lt
  threshold: 0.7
  min_consecutive_samples: 1
  source: timeline

slow_query:
  metric: slow_queries_total
  aggregation: delta
  reference: snapshot
  operator: gte
  threshold: 1
  min_consecutive_samples: 1
  source: snapshot

lock_contention:
  metric: lock_waits
  aggregation: delta
  reference: window_start
  operator: gt
  threshold: 0
  min_consecutive_samples: 1
  source: snapshot

lock_contention_severe:
  metric: lock_wait_time_ms
  aggregation: delta
  reference: snapshot
  operator: gte
  threshold: 1000
  min_consecutive_samples: 1
  source: snapshot

active_lock_wait:
  metric: lock_waits_current
  aggregation: max
  reference: absolute
  operator: gt
  threshold: 0
  min_consecutive_samples: 1
  source: timeline

connections_up:
  metric: threads_connected
  aggregation: ratio
  reference: baseline
  operator: gt
  threshold: 1.2
  min_consecutive_samples: 1
  source: timeline

query_duration:
  metric: action_duration_ms
  aggregation: max
  reference: absolute
  operator: gte
  threshold: 100
  min_consecutive_samples: 1
  source: timeline

sql_cpu_pressure:
  metric: cpu_percent
  aggregation: delta
  reference: baseline
  operator: gte
  threshold: 10
  min_consecutive_samples: 1
  source: timeline

cpu_pressure_50:
  metric: cpu_percent
  aggregation: max
  reference: absolute
  operator: gt
  threshold: 40
  min_consecutive_samples: 1
  source: timeline

cpu_pressure_80:
  metric: cpu_percent
  aggregation: max
  reference: absolute
  operator: gt
  threshold: 60
  min_consecutive_samples: 1
  source: timeline

memory_pressure:
  metric: memory_percent
  aggregation: delta
  reference: baseline
  operator: gte
  threshold: 10
  min_consecutive_samples: 1
  source: timeline
